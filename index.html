<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTARA - Maquillaje y Skincare</title>
    
    <meta property="og:title" content="ANTARA - Catálogo y Pedidos">
    <meta property="og:description" content="Maquillaje, Skincare y Accesorios. Haz tu pedido directo por Instagram.">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#fbf9f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ANTARA">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f6; 
            --card-bg: #ffffff;  
            --text-main: #000000; /* Negro profundo puro */
            --text-muted: #555555; /* Gris más oscuro y legible */
            --primary-tone: #a88267; 
            --border-color: #e6dad0; 
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
        }

        /* Banner Superior con Negro Profundo */
        .promo-banner {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 9px 10px;
            text-transform: uppercase;
        }
        
        /* Encabezado con Logo Ampliado y sin márgenes vacíos */
        header { 
            background-color: #ffffff; 
            padding: 30px 15px 20px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow: hidden;
        }
        .logo-img {
            max-width: 280px; /* Tamaño grande de impacto */
            width: 100%;
            height: auto;
            display: block;
            margin: -15px auto; /* Sube la imagen para recortar el aire sobrante de arriba y abajo */
            transform: scale(1.3); /* Expande la imagen para que ocupe todo el protagonismo */
        }

        .catalog-container { 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 10px 15px 100px 15px; 
        }

        /* Filtros Rápidos */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 22px 0 10px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            border: 1.5px solid #000000;
            color: #555555;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #000000;
            color: #ffffff;
            border-color: #000000;
        }
        
        /* Títulos de Categorías (Negro puro) */
        .category-header { 
            border-bottom: 1.5px solid #000000; 
            padding-bottom: 6px; 
            margin: 35px 0 15px 0; 
        }
        .category-header h2 { 
            font-family: 'Syne', sans-serif;
            color: #000000; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }
        .product-thumb { 
            width: 85px; 
            height: 85px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 1px solid #f0eae1; 
            flex-shrink: 0; 
            background: #f9f6f0; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .product-thumb:hover { transform: scale(1.03); }
        
        .product-info { flex-grow: 1; }
        
        .product-info h3 { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0 0 3px 0; 
            font-size: 15px; 
            font-weight: 700; 
            color: #000000; 
        }
        .product-info p { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0 0 6px 0; 
            color: var(--text-muted); 
            font-size: 12px; 
            line-height: 1.4; 
        }
        
        .product-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        
        .price { 
            font-family: 'Syne', sans-serif;
            font-weight: 700; 
            color: #000000; 
            font-size: 15px; 
        }
        .stock-tag { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 10px; 
            font-weight: 600; 
            padding: 2px 8px; 
            border-radius: 6px; 
            background: #e2f0d9; 
            color: #275d29; 
        }
        
        /* Botones de Agregar en Negro Sólido */
        .btn-add { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #000000; 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600; 
            transition: background 0.2s, transform 0.1s; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .btn-add:hover { background: #333333; }
        .btn-add:active { transform: scale(0.95); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; color: #000000; width: 90%; max-width: 480px; padding: 25px; border-radius: 16px; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 1px solid var(--border-color); font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .modal-imagen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 300; text-align: center; }
        .modal-imagen img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .cerrar-zoom { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; font-weight: bold; cursor: pointer; }

        /* Barra de Carrito con Negro Sólido */
        .cart-bar { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #000000; 
            color: #ffffff; 
            padding: 18px; 
            text-align: center; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15); 
            font-size: 15px; 
            z-index: 100; 
            transition: background 0.2s; 
        }
        .cart-bar:hover { background: #222222; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0eae1; padding: 12px 0; }
        .cart-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #f0eae1; color: #000000; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .btn-remove { background: #fde8e8; color: #c53030; border: none; padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 11px; }
        
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; font-weight: 600; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; margin-top: 15px; }
        .btn-close { background: #e8e2dc; color: #000000; border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 8px; font-weight: 600; }
        .loading { text-align: center; font-size: 16px; color: var(--text-muted); padding: 50px; font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body>

    <div class="promo-banner">
        ✨ Entregas personales en Santiago y Monterrey • Pide directo por DM 💖
    </div>

    <header>
        <!-- Tu Logo Oficial en Imagen Ampliado -->
        <img src="https://i.postimg.cc/yxGwgwkZ/Disen-o-sin-ti-tulo-(1).png" alt="ANTARA Beauty Co." class="logo-img">

        <div class="filter-container">
            <button class="filter-btn active" onclick="filtrarCategoria('todos', this)">✨ Todo</button>
            <button class="filter-btn" onclick="filtrarCategoria('maquillaje', this)">💄 Maquillaje</button>
            <button class="filter-btn" onclick="filtrarCategoria('skincare', this)">💧 Skincare</button>
            <button class="filter-btn" onclick="filtrarCategoria('accesorios', this)">👜 Accesorios</button>
        </div>
    </header>

    <div class="catalog-container" id="catalog">
        <div class="loading">Sincronizando inventario con Google Sheets... ✨</div>
    </div>

    <div class="modal-imagen" id="modalZoom" onclick="cerrarZoom()">
        <span class="cerrar-zoom">&times;</span>
        <img id="imgZoom" src="" alt="Vista previa">
    </div>

    <div class="cart-bar" id="barraCarrito" onclick="abrirCarrito()">
        🛍️ Ver Carrito (<span id="contador-items">0</span> productos) • Total: $<span id="total-bar">0</span> MXN
    </div>

    <div class="modal" id="modalCarrito">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size: 18px; color: #000000;">Tu Carrito de Compras</h2>
            <div id="lista-carrito-modal">
                <p>Tu carrito está vacío.</p>
            </div>
            <h3 style="margin-bottom: 5px; margin-top: 15px; font-size: 16px; color: #000000;">Total: $<span id="total-modal">0</span> MXN</h3>
            
            <button class="btn-instagram" onclick="enviarPedidoInstagram()">📸 Enviar Pedido por Instagram DM</button>
            <button class="btn-close" onclick="cerrarCarrito()">Cerrar y seguir viendo</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp1DP4PFs8v0H5osvm29B5oJsQDc0rNyf4jFlEbHNbIUDwRHtRluwlFsxywODRGzLe/exec";
        
        let datosOriginales = [];
        let categoriaActiva = 'todos';
        let carrito = [];

        function abrirZoom(urlImagen) {
            document.getElementById('imgZoom').src = urlImagen;
            document.getElementById('modalZoom').style.display = 'flex';
        }

        function cerrarZoom() {
            document.getElementById('modalZoom').style.display = 'none';
        }

        function cargarCatalogo() {
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=procesarDatosCatalogo&t=${new Date().getTime()}`;
            script.onerror = function() {
                document.getElementById('catalog').innerHTML = `<p style="color:#000000; text-align:center;">Error al conectar con la hoja de cálculo.</p>`;
            };
            document.body.appendChild(script);
        }

        function procesarDatosCatalogo(datosCrudos) {
            datosOriginales = datosCrudos.map(item => ({
                nombre: item["producto"] || item["nombre"] || "Sin nombre",
                categoria: item["categoría"] || item["categoria"] || "", 
                precio: Number(item["precio"]) || 0,
                desc: item["detalles / tono"] || item["detalles"] || "",
                imagen: item["imagen"] || "",
                existencia: item["existencia"] !== undefined ? Number(item["existencia"]) : 1
            }));

            renderizarCatalogo();
        }

        function filtrarCategoria(cat, boton) {
            categoriaActiva = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById('catalog');
            let html = "";
            let categoriasMap = { "maquillaje": "💄", "skincare": "✨", "accesorios": "👜" };
            let listaCategorias = ["maquillaje", "skincare", "accesorios"];
            let hayProductos = false;

            listaCategorias.forEach(cat => {
                if (categoriaActiva !== 'todos' && categoriaActiva !== cat) {
                    return;
                }

                let productosFiltrados = datosOriginales.filter(item => {
                    let c = item.categoria ? item.categoria.trim().toLowerCase() : "";
                    return c.includes(cat) || (cat === "accesorios" && c.includes("accesorio"));
                });

                if (productosFiltrados.length > 0) {
                    hayProductos = true;
                    let tituloCat = cat.charAt(0).toUpperCase() + cat.slice(1);
                    html += `<div class="category-header"><h2>${categoriasMap[cat]} ${tituloCat}</h2></div>`;
                    
                    productosFiltrados.forEach(item => {
                        let imagenHtml = item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" class="product-thumb" onclick="abrirZoom('${item.imagen}')">` : '';
                        let enStock = item.existencia > 0;
                        let stockHtml = enStock ? `<span class="stock-tag">Disponible</span>` : `<span class="stock-tag out" style="background:#fde8e8; color:#c53030;">Agotado</span>`;
                        let botonHtml = enStock ? `<button class="btn-add" onclick='agregarAlCarrito(${JSON.stringify(item)}, event)'>Agregar</button>` : `<button class="btn-add" style="background:#ccc; cursor:not-allowed;" disabled>Agotado</button>`;

                        html += `
                            <div class="product-card">
                                ${imagenHtml}
                                <div class="product-info">
                                    <h3>${item.nombre}</h3>
                                    <p>${item.desc}</p>
                                    <div class="product-meta">
                                        <span class="price">$${item.precio} MXN</span>
                                        ${stockHtml}
                                    </div>
                                </div>
                                ${botonHtml}
                            </div>
                        `;
                    });
                }
            });

            if (!hayProductos) {
                html = `<p style="text-align:center; color:var(--text-muted); padding:40px;">No hay productos en esta categoría.</p>`;
            }

            contenedor.innerHTML = html;
        }

        function agregarAlCarrito(item, event) {
            let encontrado = carrito.find(i => i.nombre === item.nombre && i.desc === item.desc);
            if (encontrado) {
                encontrado.cantidad += 1;
            } else {
                carrito.push({
                    nombre: item.nombre,
                    precio: item.precio,
                    desc: item.desc,
                    cantidad: 1
                });
            }
            actualizarCarritoUI();
        }

        function cambiarCantidad(nombre, desc, cambio) {
            let item = carrito.find(i => i.nombre === nombre && i.desc === desc);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => !(i.nombre === nombre && i.desc === desc));
                }
            }
            actualizarCarritoUI();
            actualizarModalCarrito();
        }

        function actualizarCarritoUI() {
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-bar').innerText = totalPrice;
        }

        function abrirCarrito() {
            actualizarModalCarrito();
            document.getElementById('modalCarrito').style.display = 'flex';
        }

        function cerrarCarrito() {
            document.getElementById('modalCarrito').style.display = 'none';
        }

        function actualizarModalCarrito() {
            const contenedorModal = document.getElementById('lista-carrito-modal');
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('total-modal').innerText = totalPrice;

            if (carrito.length === 0) {
                contenedorModal.innerHTML = "<p style='color: #888; text-align: center;'>Tu carrito está vacío.</p>";
                return;
            }

            let html = "";
            carrito.forEach(item => {
                let detalleStr = item.desc ? ` (${item.desc})` : '';
                html += `
                    <div class="cart-item">
                        <div>
                            <strong style="color:#000000; font-size: 14px;">${item.nombre}${detalleStr}</strong><br>
                            <small style="color:#555555;">$${item.precio} x ${item.cantidad} = $${item.precio * item.cantidad} MXN</small>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -1)">-</button>
                            <span style="color:#000000; font-weight:600;">${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', 1)">+</button>
                            <button class="btn-remove" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -${item.cantidad})">✕</button>
                        </div>
                    </div>
                `;
            });
            contenedorModal.innerHTML = html;
        }

        function enviarPedidoInstagram() {
            if (carrito.length === 0) {
                alert("Agrega productos al carrito primero.");
                return;
            }

            let mensaje = "✨ *NUEVO PEDIDO - ANTARA* ✨\n\nHola, me gustaría apartar / comprar los siguientes productos:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                let detalleStr = item.desc ? ` (${item.desc})` : '';
                mensaje += `${index + 1}. ${item.cantidad}x *${item.nombre}${detalleStr}* - $${subtotal} MXN\n`;
                totalGeneral += subtotal;
            });

            mensaje += `\n🛍️ *TOTAL A PAGAR:* *${totalGeneral} MXN*\n\n¿Me confirman disponibilidad y datos por favor? 💖`;

            let url = `https://www.instagram.com/antara_beautyy/`;
            
            navigator.clipboard.writeText(mensaje).then(() => {
                alert("¡Pedido copiado al portapapeles! Ahora se abrirá Instagram de ANTARA para que lo pegues en el chat y nos lo envíes. 💖");
                window.open(url, '_blank');
            }).catch(err => {
                window.open(url, '_blank');
            });
        }

        cargarCatalogo();
    </script>

</body>
</html>
