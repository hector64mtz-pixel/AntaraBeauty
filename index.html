<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTARA - Maquillaje y Skincare</title>
    
    <!-- Configuración de Vista Previa -->
    <meta property="og:title" content="ANTARA - Catálogo y Pedidos">
    <meta property="og:description" content="Maquillaje, Skincare y Accesorios. Haz tu pedido directo por Instagram.">
    <meta property="og:type" content="website">

    <!-- Configuración para App Móvil -->
    <meta name="theme-color" content="#fbf9f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ANTARA">

    <!-- Tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f6; 
            --card-bg: #ffffff;  
            --text-main: #2c2c2c; 
            --text-muted: #7d7d7d; 
            --primary-tone: #b8977e; 
            --primary-hover: #9c7b63;
            --border-color: #eee4dc; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
        }

        /* Banner de Promociones Superior */
        .promo-banner {
            background-color: #2c2c2c;
            color: #fbf9f6;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 8px 10px;
            text-transform: uppercase;
        }
        
        /* Encabezado Minimalista Chic */
        header { 
            background-color: #ffffff; 
            padding: 25px 15px 15px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-main);
            text-transform: uppercase;
        }
        p.subtitle { 
            color: var(--primary-tone); 
            margin: 6px 0 0 0; 
            font-weight: 600; 
            font-size: 11px; 
            letter-spacing: 2.5px; 
            text-transform: uppercase; 
        }

        /* Contenedor Principal */
        .catalog-container { 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 10px 15px 100px 15px; 
        }

        /* Botones de Filtro Rápido por Categoría */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 25px 0 10px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }
        
        .category-header { 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 8px; 
            margin: 35px 0 15px 0; 
        }
        .category-header h2 { 
            color: var(--text-main); 
            margin: 0; 
            font-size: 16px; 
            font-weight: 600; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Tarjetas de Productos Minimalistas */
        .product-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }
        .product-thumb { 
            width: 85px; 
            height: 85px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 1px solid #f0eae1; 
            flex-shrink: 0; 
            background: #f9f6f0; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .product-thumb:hover { transform: scale(1.03); }
        .product-info { flex-grow: 1; }
        .product-info h3 { margin: 0 0 3px 0; font-size: 15px; font-weight: 600; color: #2c2c2c; }
        .product-info p { margin: 0 0 6px 0; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
        
        /* Indicador de Stock y Precio */
        .product-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .price { font-weight: 700; color: var(--primary-tone); font-size: 14px; }
        .stock-tag { 
            font-size: 10px; 
            font-weight: 600; 
            padding: 2px 8px; 
            border-radius: 6px; 
            background: #edf7ed; 
            color: #2e7d32; 
            letter-spacing: 0.5px;
        }
        .stock-tag.out {
            background: #fde8e8;
            color: #c53030;
        }
        
        .btn-add { 
            background: var(--text-main); 
            color: white; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600; 
            transition: background 0.2s, transform 0.1s; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-add:hover { background: var(--primary-tone); }
        .btn-add:active { transform: scale(0.95); }

        /* Animación de producto volando al carrito */
        @keyframes volarAlCarrito {
            0% { opacity: 1; transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.3) translate(-20px, -60px) rotate(-10deg); }
            85% { transform: scale(0.8) translate(0, 120px) rotate(5deg); }
            100% { opacity: 0; transform: scale(0.4) translate(0, 180px) rotate(0deg); }
        }
        .item-volador {
            position: fixed;
            font-size: 24px;
            z-index: 9999;
            pointer-events: none;
            animation: volarAlCarrito 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Modales Estilizados Minimalistas */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; color: #2c2c2c; width: 90%; max-width: 480px; padding: 25px; border-radius: 16px; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        
        .modal-imagen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 300; text-align: center; }
        .modal-imagen img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .cerrar-zoom { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; font-weight: bold; cursor: pointer; }

        /* Barra de Carrito Inferior Estilo Boutique */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #ffffff; 
            border-top: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 16px; 
            text-align: center; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05); 
            font-size: 15px; 
            z-index: 100; 
            transition: background 0.2s; 
        }
        .cart-bar:hover { background: #f9f6f0; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0eae1; padding: 12px 0; }
        .cart-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #f0eae1; color: #2c2c2c; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .btn-remove { background: #e0b1b1; color: #5a1a1a; border: none; padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 11px; }
        
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; font-weight: 600; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; box-shadow: 0 4px 12px rgba(220, 39, 67, 0.2); margin-top: 15px; transition: opacity 0.2s; }
        .btn-instagram:hover { opacity: 0.9; }

        .btn-close { background: #e8e2dc; color: #5c554e; border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <!-- Banner con Entregas Personales -->
    <div class="promo-banner">
        ✨ Entregas personales en Monterrey • Pide directo por DM 💖
    </div>

    <header>
        <h1>ANTARA</h1>
        <p class="subtitle">Maquillaje • Skincare • Accesorios</p>

        <!-- Filtros Rápidos por Categoría -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filtrarCategoria('todos', this)">✨ Todo</button>
            <button class="filter-btn" onclick="filtrarCategoria('maquillaje', this)">💄 Maquillaje</button>
            <button class="filter-btn" onclick="filtrarCategoria('skincare', this)">💧 Skincare</button>
            <button class="filter-btn" onclick="filtrarCategoria('accesorio', this)">👜 Accesorios</button>
        </div>
    </header>

    <div class="catalog-container" id="catalog">
        <!-- Contenido dinámico -->
    </div>

    <!-- Visor de Imagen en Grande (Zoom) -->
    <div class="modal-imagen" id="modalZoom" onclick="cerrarZoom()">
        <span class="cerrar-zoom">&times;</span>
        <img id="imgZoom" src="" alt="Vista previa">
    </div>

    <div class="cart-bar" id="barraCarrito" onclick="abrirCarrito()">
        🛍️ Ver Carrito (<span id="contador-items">0</span> productos) • Total: $<span id="total-bar">0</span> MXN
    </div>

    <div class="modal" id="modalCarrito">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size: 18px;">Tu Carrito de Compras</h2>
            <div id="lista-carrito-modal">
                <p>Tu carrito está vacío.</p>
            </div>
            <h3 style="margin-bottom: 5px; margin-top: 15px; font-size: 16px;">Total: $<span id="total-modal">0</span> MXN</h3>
            
            <button class="btn-instagram" onclick="enviarPedidoInstagram()">📸 Enviar Pedido por Instagram DM</button>
            <button class="btn-close" onclick="cerrarCarrito()">Cerrar y seguir viendo</button>
        </div>
    </div>

    <!-- Base de Datos Sincronizada con Tus Enlaces Reales de la Hoja -->
    <script>
        const productosAntara = [
            {
                nombre: "Good Molecular",
                categoria: "Skincare",
                precio: 320,
                desc: "Hydration facial cleansing gel",
                imagen: "https://i.postimg.cc/placeholder-good.jpg", 
                existencia: 1
            },
            {
                nombre: "Frasier sterling puffer cosmetic pouch",
                categoria: "Accesorios",
                precio: 415,
                desc: "Rosa",
                imagen: "https://i.postimg.cc/placeholder-puffer1.jpg",
                existencia: 1
            },
            {
                nombre: "Frasier sterling puffer cosmetic pouch",
                categoria: "Accesorios",
                precio: 415,
                desc: "Beige",
                imagen: "https://i.postimg.cc/placeholder-puffer2.jpg",
                existencia: 1
            },
            {
                nombre: "DIOR | Lip Glow Butter Hydrating Gloss Balm",
                categoria: "Maquillaje",
                precio: 1095,
                desc: "101 Glazed Pink",
                imagen: "https://i.postimg.cc/placeholder-dior.jpg",
                existencia: 1
            },
            {
                nombre: "rhode | Glazing Milk Hydrating",
                categoria: "Skincare",
                precio: 860,
                desc: "Ceramide Facial Essence",
                imagen: "https://i.postimg.cc/placeholder-rhode1.jpg",
                existencia: 1
            },
            {
                nombre: "rhode | Peptide Lip Tint Nourishing Glaze",
                categoria: "Maquillaje",
                precio: 550,
                desc: "Raspberry Jelly",
                imagen: "https://i.postimg.cc/placeholder-rhode2.jpg",
                existencia: 1
            }
        ];

        let categoriaActiva = 'todos';
        let carrito = [];

        function abrirZoom(urlImagen) {
            document.getElementById('imgZoom').src = urlImagen;
            document.getElementById('modalZoom').style.display = 'flex';
        }

        function cerrarZoom() {
            document.getElementById('modalZoom').style.display = 'none';
        }

        function filtrarCategoria(cat, boton) {
            categoriaActiva = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById('catalog');
            let html = "";
            let categoriasMap = { "Maquillaje": "💄", "Skincare": "✨", "Accesorios": "👜" };
            let listaCategorias = ["Maquillaje", "Skincare", "Accesorios"];
            let hayProductos = false;

            listaCategorias.forEach(cat => {
                if (categoriaActiva !== 'todos' && !cat.toLowerCase().includes(categoriaActiva)) {
                    return;
                }

                let productosFiltrados = productosAntara.filter(item => {
                    let c = item.categoria ? item.categoria.trim().toLowerCase() : "";
                    return c.includes(cat.toLowerCase());
                });

                if (productosFiltrados.length > 0) {
                    hayProductos = true;
                    html += `<div class="category-header"><h2>${categoriasMap[cat]} ${cat}</h2></div>`;
                    
                    productosFiltrados.forEach(item => {
                        let imagenHtml = item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" class="product-thumb" onclick="abrirZoom('${item.imagen}')" onerror="this.src='https://images.unsplash.com/photo-1599733589046-10c005739ef9?auto=format&fit=crop&w=400&q=80'">` : '';
                        let enStock = item.existencia > 0;
                        let stockHtml = enStock ? `<span class="stock-tag">Disponible</span>` : `<span class="stock-tag out">Agotado</span>`;
                        let botonHtml = enStock ? `<button class="btn-add" onclick='agregarAlCarrito(${JSON.stringify(item)}, event)'>Agregar</button>` : `<button class="btn-add" style="background:#ccc; cursor:not-allowed;" disabled>Agotado</button>`;

                        html += `
                            <div class="product-card">
                                ${imagenHtml}
                                <div class="product-info">
                                    <h3>${item.nombre}</h3>
                                    <p>${item.desc}</p>
                                    <div class="product-meta">
                                        <span class="price">$${item.precio} MXN</span>
                                        ${stockHtml}
                                    </div>
                                </div>
                                ${botonHtml}
                            </div>
                        `;
                    });
                }
            });

            if (!hayProductos) {
                html = `<p style="text-align:center; color:var(--text-muted); padding:40px;">No hay productos en esta categoría.</p>`;
            }

            contenedor.innerHTML = html;
        }

        function agregarAlCarrito(item, event) {
            animarItemAlCarrito(event.target);

            let encontrado = carrito.find(i => i.nombre === item.nombre && i.desc === item.desc);
            if (encontrado) {
                encontrado.cantidad += 1;
            } else {
                carrito.push({
                    nombre: item.nombre,
                    precio: item.precio,
                    desc: item.desc,
                    cantidad: 1
                });
            }

            actualizarCarritoUI();
        }

        function animarItemAlCarrito(boton) {
            let rect = boton.getBoundingClientRect();
            let anim = document.createElement('div');
            anim.className = 'item-volador';
            anim.innerHTML = '✨';
            anim.style.left = (rect.left + rect.width / 2 - 12) + 'px';
            anim.style.top = (rect.top) + 'px';
            document.body.appendChild(anim);

            setTimeout(() => {
                let barra = document.getElementById('barraCarrito');
                barra.style.transform = 'scale(1.02)';
                setTimeout(() => { barra.style.transform = 'scale(1)'; }, 150);
            }, 500);

            setTimeout(() => { anim.remove(); }, 650);
        }

        function cambiarCantidad(nombre, desc, cambio) {
            let item = carrito.find(i => i.nombre === nombre && i.desc === desc);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => !(i.nombre === nombre && i.desc === desc));
                }
            }
            actualizarCarritoUI();
            actualizarModalCarrito();
        }

        function actualizarCarritoUI() {
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-bar').innerText = totalPrice;
        }

        function abrirCarrito() {
            actualizarModalCarrito();
            document.getElementById('modalCarrito').style.display = 'flex';
        }

        function cerrarCarrito() {
            document.getElementById('modalCarrito').style.display = 'none';
        }

        function actualizarModalCarrito() {
            const contenedorModal = document.getElementById('lista-carrito-modal');
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('total-modal').innerText = totalPrice;

            if (carrito.length === 0) {
                contenedorModal.innerHTML = "<p style='color: #888; text-align: center;'>Tu carrito está vacío.</p>";
                return;
            }

            let html = "";
            carrito.forEach(item => {
                let detalleStr = item.desc ? ` (${item.desc})` : '';
                html += `
                    <div class="cart-item">
                        <div>
                            <strong style="color:#2c2c2c; font-size: 14px;">${item.nombre}${detalleStr}</strong><br>
                            <small style="color:#7d7d7d;">$${item.precio} x ${item.cantidad} = $${item.precio * item.cantidad} MXN</small>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -1)">-</button>
                            <span style="color:#2c2c2c; font-weight:600;">${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', 1)">+</button>
                            <button class="btn-remove" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -${item.cantidad})">✕</button>
                        </div>
                    </div>
                `;
            });
            contenedorModal.innerHTML = html;
        }

        function enviarPedidoInstagram() {
            if (carrito.length === 0) {
                alert("Agrega productos al carrito primero.");
                return;
            }

            let mensaje = "✨ *NUEVO PEDIDO - ANTARA* ✨\n\nHola, me gustaría apartar / comprar los siguientes productos:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                let detalleStr = item.desc ? ` (${item.desc})` : '';
                mensaje += `${index + 1}. ${item.cantidad}x *${item.nombre}${detalleStr}* - $${subtotal} MXN\n`;
                totalGeneral += subtotal;
            });

            mensaje += `\n🛍️ *TOTAL A PAGAR:* *${totalGeneral} MXN*\n\n¿Me confirman disponibilidad y datos por favor? 💖`;

            let url = `https://www.instagram.com/antara_beautyy/`;
            
            navigator.clipboard.writeText(mensaje).then(() => {
                alert("¡Pedido copiado al portapapeles! Ahora se abrirá Instagram de ANTARA para que lo pegues en el chat y nos lo envíes. 💖");
                window.open(url, '_blank');
            }).catch(err => {
                window.open(url, '_blank');
            });
        }

        renderizarCatalogo();
    </script>

</body>
</html>
