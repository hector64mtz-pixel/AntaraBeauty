<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTARA - Maquillaje y Skincare</title>
    
    <meta property="og:title" content="ANTARA - Catálogo y Pedidos">
    <meta property="og:description" content="Maquillaje, Skincare y Accesorios. Haz tu pedido directo por Instagram.">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#fbf9f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ANTARA">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f6; 
            --card-bg: #ffffff;  
            --text-main: #2c2c2c; 
            --text-muted: #7d7d7d; 
            --primary-tone: #b8977e; 
            --primary-hover: #9c7b63;
            --border-color: #eee4dc; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
        }
        
        /* Encabezado Minimalista Chic */
        header { 
            background-color: #ffffff; 
            padding: 35px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-main);
            text-transform: uppercase;
        }
        p.subtitle { 
            color: var(--primary-tone); 
            margin: 8px 0 0 0; 
            font-weight: 600; 
            font-size: 12px; 
            letter-spacing: 2.5px; 
            text-transform: uppercase; 
        }

        /* Contenedor Principal */
        .catalog-container { 
            max-width: 750px; 
            margin: 0 auto; 
            padding: 10px 15px 100px 15px; 
        }
        
        .category-header { 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 8px; 
            margin: 40px 0 20px 0; 
        }
        .category-header h2 { 
            color: var(--text-main); 
            margin: 0; 
            font-size: 18px; 
            font-weight: 600; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Tarjetas de Productos Minimalistas */
        .product-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }
        .product-thumb { 
            width: 85px; 
            height: 85px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 1px solid #f0eae1; 
            flex-shrink: 0; 
            background: #f9f6f0; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .product-thumb:hover { transform: scale(1.03); }
        .product-info { flex-grow: 1; }
        .product-info h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; color: #2c2c2c; }
        .product-info p { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
        .price { font-weight: 700; color: var(--primary-tone); font-size: 14px; display: block; margin-top: 6px; }
        
        .btn-add { 
            background: var(--text-main); 
            color: white; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600; 
            transition: background 0.2s, transform 0.1s; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-add:hover { background: var(--primary-tone); }
        .btn-add:active { transform: scale(0.95); }

        /* Animación de producto volando al carrito */
        @keyframes volarAlCarrito {
            0% { opacity: 1; transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.3) translate(-20px, -60px) rotate(-10deg); }
            85% { transform: scale(0.8) translate(0, 120px) rotate(5deg); }
            100% { opacity: 0; transform: scale(0.4) translate(0, 180px) rotate(0deg); }
        }
        .item-volador {
            position: fixed;
            font-size: 24px;
            z-index: 9999;
            pointer-events: none;
            animation: volarAlCarrito 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Modales Estilizados Minimalistas */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; color: #2c2c2c; width: 90%; max-width: 420px; padding: 25px; border-radius: 16px; max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid var(--border-color); text-align: center; }
        
        .modal-product-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 15px; background: #f9f6f0; }

        .modal-imagen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 300; text-align: center; }
        .modal-imagen img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .cerrar-zoom { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; font-weight: bold; cursor: pointer; }

        .textarea-notes { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #dcd6ce; background: #faf8f5; color: #2c2c2c; border-radius: 8px; margin-top: 5px; resize: vertical; font-family: 'Plus Jakarta Sans', sans-serif; text-align: left; }
        .textarea-notes:focus { border-color: var(--primary-tone); outline: none; }

        /* Barra de Carrito Inferior Estilo Boutique */
        .cart-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #ffffff; 
            border-top: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 16px; 
            text-align: center; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05); 
            font-size: 15px; 
            z-index: 100; 
            transition: background 0.2s; 
        }
        .cart-bar:hover { background: #f9f6f0; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0eae1; padding: 12px 0; text-align: left; }
        .cart-controls { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #f0eae1; color: #2c2c2c; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .btn-remove { background: #e0b1b1; color: #5a1a1a; border: none; padding: 5px 8px; cursor: pointer; border-radius: 6px; font-size: 11px; }
        
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; font-weight: 600; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; box-shadow: 0 4px 12px rgba(220, 39, 67, 0.2); margin-top: 15px; transition: opacity 0.2s; }
        .btn-instagram:hover { opacity: 0.9; }
        
        .btn-primary { background: var(--primary-tone); color: white; font-weight: 600; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 15px; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-close { background: #e8e2dc; color: #5c554e; border: none; padding: 10px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 8px; }
        
        .loading-text { text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>ANTARA</h1>
        <p class="subtitle">Maquillaje • Skincare • Accesorios</p>
    </header>

    <div class="catalog-container" id="catalog">
        <div class="loading-text">Cargando productos desde el inventario... ✨</div>
    </div>

    <div class="modal-imagen" id="modalZoom" onclick="cerrarZoom()">
        <span class="cerrar-zoom">&times;</span>
        <img id="imgZoom" src="" alt="Vista previa">
    </div>

    <div class="cart-bar" id="barraCarrito" onclick="abrirCarrito()">
        🛍️ Ver Carrito (<span id="contador-items">0</span> productos) • Total: $<span id="total-bar">0</span> MXN
    </div>

    <!-- Modal con foto, descripción y notas -->
    <div class="modal" id="modalPersonalizar">
        <div class="modal-content">
            <img id="modal-img-producto" class="modal-product-img" src="" alt="Producto">
            <h2 id="modal-titulo-producto" style="margin:0 0 5px 0; color:var(--text-main); font-size: 17px; font-weight:600;"></h2>
            <p id="modal-desc-producto" style="font-size: 13px; color: var(--text-muted); margin: 0 0 10px 0;"></p>
            <p id="modal-precio-producto" style="font-size: 15px; color: var(--primary-tone); font-weight: 700; margin: 0 0 15px 0;"></p>
            
            <label style="font-size: 12px; font-weight: 600; display: block; margin-top: 10px; color: #444; text-align: left;">Notas especiales (Tono, variante, etc.):</label>
            <textarea id="input-notas" class="textarea-notes" rows="2" placeholder="Ej. Tono nude, sellado para regalo..."></textarea>

            <button class="btn-primary" onclick="confirmarPersonalizacion()">Agregar al Carrito</button>
            <button class="btn-close" onclick="cerrarPersonalizar()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modalCarrito">
        <div class="modal-content" style="text-align: left;">
            <h2 style="margin-top:0; font-size: 18px; text-align: center;">Tu Carrito de Compras</h2>
            <div id="lista-carrito-modal">
                <p style="text-align: center;">Tu carrito está vacío.</p>
            </div>
            <h3 style="margin-bottom: 5px; margin-top: 15px; font-size: 16px; text-align: right;">Total: $<span id="total-modal">0</span> MXN</h3>
            
            <button class="btn-instagram" onclick="enviarPedidoInstagram()">📸 Enviar Pedido por Instagram DM</button>
            <button class="btn-close" onclick="cerrarCarrito()">Cerrar y seguir viendo</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzfMGe4DuKT7nv8vNQpvuagrJof5wfGBHRmT0BG9HgkzpZ4zoGTJi9fFuuzEdTaaTBg/exec";

        let catalogData = { Maquillaje: [], Skincare: [], Accesorios: [] };
        let carrito = [];
        let productoEnEdicion = null;

        function abrirZoom(urlImagen) {
            document.getElementById('imgZoom').src = urlImagen;
            document.getElementById('modalZoom').style.display = 'flex';
        }

        function cerrarZoom() {
            document.getElementById('modalZoom').style.display = 'none';
        }

        async function cargarCatalogoDesdeGoogleSheet() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();

                catalogData = { Maquillaje: [], Skincare: [], Accesorios: [] };

                data.forEach(item => {
                    if (!item.producto) return;
                    if (item.existencia !== undefined && Number(item.existencia) === 0) return;

                    let cat = item.categoría ? item.categoría.trim() : "";
                    
                    let productoLimpio = {
                        nombre: item.producto,
                        categoria: cat,
                        precio: Number(item.precio) || 0,
                        desc: item["detalles / tono"] || "",
                        imagen: item.imagen || ""
                    };

                    if (cat.toLowerCase().includes("maquillaje")) {
                        catalogData.Maquillaje.push(productoLimpio);
                    } else if (cat.toLowerCase().includes("skincare")) {
                        catalogData.Skincare.push(productoLimpio);
                    } else if (cat.toLowerCase().includes("accesorio")) {
                        catalogData.Accesorios.push(productoLimpio);
                    }
                });

                renderizarCatalogo();
            } catch (error) {
                console.error("Error al cargar el catálogo:", error);
                document.getElementById('catalog').innerHTML = `<p style="text-align:center; color:#c96b6b;">Error al cargar los productos. Intenta recargar la página.</p>`;
            }
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById('catalog');
            let html = "";
            const ordenCategorias = ["Maquillaje", "Skincare", "Accesorios"];
            const iconosCat = { "Maquillaje": "💄", "Skincare": "✨", "Accesorios": "👜" };

            let hayProductos = false;

            ordenCategorias.forEach(cat => {
                let listaProductos = catalogData[cat] || [];
                if (listaProductos.length > 0) {
                    hayProductos = true;
                    html += `<div class="category-header"><h2>${iconosCat[cat]} ${cat}</h2></div>`;
                    listaProductos.forEach(item => {
                        let imagenHtml = item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" class="product-thumb" onclick="abrirZoom('${item.imagen}')">` : '';

                        html += `
                            <div class="product-card">
                                ${imagenHtml}
                                <div class="product-info">
                                    <h3>${item.nombre}</h3>
                                    <p>${item.desc}</p>
                                    <span class="price">$${item.precio} MXN</span>
                                </div>
                                <button class="btn-add" onclick='prepararPersonalizacion(${JSON.stringify(item)}, event)'>Agregar</button>
                            </div>
                        `;
                    });
                }
            });

            if (!hayProductos) {
                html = `<p style="text-align:center; color:#7d7d7d; padding:40px;">No hay productos disponibles por el momento.</p>`;
            }

            contenedor.innerHTML = html;
        }

        function prepararPersonalizacion(item, event) {
            animarItemAlCarrito(event.target);
            productoEnEdicion = item;
            
            document.getElementById('modal-img-producto').src = item.imagen || '';
            document.getElementById('modal-titulo-producto').innerText = item.nombre;
            document.getElementById('modal-desc-producto').innerText = item.desc;
            document.getElementById('modal-precio-producto').innerText = "$" + item.precio + " MXN";
            document.getElementById('input-notas').value = "";
            document.getElementById('modalPersonalizar').style.display = 'flex';
        }

        function animarItemAlCarrito(boton) {
            let rect = boton.getBoundingClientRect();
            let anim = document.createElement('div');
            anim.className = 'item-volador';
            anim.innerHTML = '✨';
            anim.style.left = (rect.left + rect.width / 2 - 12) + 'px';
            anim.style.top = (rect.top) + 'px';
            document.body.appendChild(anim);

            setTimeout(() => {
                let barra = document.getElementById('barraCarrito');
                barra.style.transform = 'scale(1.02)';
                setTimeout(() => { barra.style.transform = 'scale(1)'; }, 150);
            }, 500);

            setTimeout(() => { anim.remove(); }, 650);
        }

        function cerrarPersonalizar() {
            document.getElementById('modalPersonalizar').style.display = 'none';
        }

        function confirmarPersonalizacion() {
            let notasExtra = document.getElementById('input-notas').value.trim();
            let textoDetalle = notasExtra ? " (" + notasExtra + ")" : "";
            let nombreFinal = productoEnEdicion.nombre + textoDetalle;

            let encontrado = carrito.find(item => item.nombreCompleto === nombreFinal);
            if (encontrado) {
                encontrado.cantidad += 1;
            } else {
                carrito.push({
                    nombreCompleto: nombreFinal,
                    precio: productoEnEdicion.precio,
                    cantidad: 1
                });
            }

            actualizarCarritoUI();
            cerrarPersonalizar();
        }

        function cambiarCantidad(nombreCompleto, cambio) {
            let item = carrito.find(i => i.nombreCompleto === nombreCompleto);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.nombreCompleto !== nombreCompleto);
                }
            }
            actualizarCarritoUI();
            actualizarModalCarrito();
        }

        function actualizarCarritoUI() {
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-bar').innerText = totalPrice;
        }

        function abrirCarrito() {
            actualizarModalCarrito();
            document.getElementById('modalCarrito').style.display = 'flex';
        }

        function cerrarCarrito() {
            document.getElementById('modalCarrito').style.display = 'none';
        }

        function actualizarModalCarrito() {
            const contenedorModal = document.getElementById('lista-carrito-modal');
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('total-modal').innerText = totalPrice;

            if (carrito.length === 0) {
                contenedorModal.innerHTML = "<p style='color: #888; text-align: center;'>Tu carrito está vacío.</p>";
                return;
            }

            let html = "";
            carrito.forEach(item => {
                html += `
                    <div class="cart-item">
                        <div>
                            <strong style="color:#2c2c2c; font-size: 14px;">${item.nombreCompleto}</strong><br>
                            <small style="color:#7d7d7d;">$${item.precio} x ${item.cantidad} = $${item.precio * item.cantidad} MXN</small>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombreCompleto.replace(/'/g, "\\'")}', -1)">-</button>
                            <span style="color:#2c2c2c; font-weight:600;">${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombreCompleto.replace(/'/g, "\\'")}', 1)">+</button>
                            <button class="btn-remove" onclick="cambiarCantidad('${item.nombreCompleto.replace(/'/g, "\\'")}', -${item.cantidad})">✕</button>
                        </div>
                    </div>
                `;
            });
            contenedorModal.innerHTML = html;
        }

        function enviarPedidoInstagram() {
            if (carrito.length === 0) {
                alert("Agrega productos al carrito primero.");
                return;
            }

            let mensaje = "✨ *NUEVO PEDIDO - ANTARA* ✨\n\nHola, me gustaría apartar / comprar los siguientes productos:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                mensaje += `${index + 1}. ${item.cantidad}x *${item.nombreCompleto}* - $${subtotal} MXN\n`;
                totalGeneral += subtotal;
            });

            mensaje += `\n🛍️ *TOTAL A PAGAR:* *${totalGeneral} MXN*\n\n¿Me confirmar disponibilidad y datos por favor? 💖`;

            let url = `https://www.instagram.com/antara_beautyy/`;
            
            navigator.clipboard.writeText(mensaje).then(() => {
                alert("¡Pedido copiado al portapapeles! Ahora se abrirá Instagram de ANTARA para que lo pegues en el chat y nos lo envíes. 💖");
                window.open(url, '_blank');
            }).catch(err => {
                window.open(url, '_blank');
            });
        }

        cargarCatalogoDesdeGoogleSheet();
    </script>

</body>
</html>
