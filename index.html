<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTARA - Maquillaje y Skincare</title>
    
    <meta property="og:title" content="ANTARA - Catálogo y Pedidos">
    <meta property="og:description" content="Maquillaje, Skincare y Accesorios. Haz tu pedido directo por Instagram.">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#fbf9f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ANTARA">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #000000; 
            --text-muted: #555555; 
            --primary-tone: #a88267; 
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            background: linear-gradient(-45deg, #fbf9f6, #f3ece4, #ffffff, #fdf8f5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .promo-banner {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 10px;
            text-transform: uppercase;
            position: relative;
            z-index: 50;
        }
        
        header { 
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 15px 15px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--glass-border); 
            position: relative; 
            z-index: 40;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .logo-img {
            max-width: 240px; 
            width: 100%;
            height: auto;
            display: block;
            margin: -10px auto -5px auto; 
            transform: scale(1.2); 
            transition: transform 0.3s ease;
        }

        .catalog-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px 20px 120px 20px; 
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 5px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: transparent;
            border: 1.5px solid #000000;
            color: #000000;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #000000;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .category-header { 
            width: 100%;
            margin: 30px 0 25px 0; 
            text-align: center;
        }
        .category-header h2 { 
            font-family: 'Syne', sans-serif;
            color: #000000; 
            margin: 0; 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        .category-header h2::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 3px;
            background: #000000;
            bottom: -8px;
            left: 25%;
            border-radius: 2px;
        }

        /* GRID INTERACTIVO */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        /* Se eliminó la animación fadeInUp de entrada para evitar saltos molestos al scrollear */
        .product-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.95);
        }

        .thumb-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 120px 120px 16px 16px; 
            margin-bottom: 15px;
            position: relative;
            background: #f0eae1;
        }
        .product-thumb { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            cursor: pointer; 
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .product-card:hover .product-thumb { transform: scale(1.1); }
        
        .product-info { 
            display: flex;
            flex-direction: column;
            flex-grow: 1; 
            text-align: center;
        }
        
        .product-info h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .product-info p { margin: 0 0 15px 0; color: var(--text-muted); font-size: 13px; line-height: 1.5; }
        
        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        /* Formato de precio limpio y unificado */
        .price { 
            font-family: 'Syne', sans-serif; 
            font-weight: 800; 
            font-size: 18px; 
            color: var(--text-main);
        }
        .stock-tag { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #e2f0d9; color: #275d29; text-transform: uppercase; }
        
        .btn-add { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #000000; color: white; border: none; padding: 14px; border-radius: 14px; 
            cursor: pointer; font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; transition: all 0.3s ease; 
        }
        .btn-add:hover { background: #333333; transform: scale(1.02); }
        .btn-add:active { transform: scale(0.96); }

        /* ====== AJUSTES CELULAR (2 COLUMNAS) ====== */
        @media (max-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .product-card {
                padding: 10px;
                border-radius: 18px;
            }
            .thumb-container {
                height: 160px; 
                border-radius: 60px 60px 10px 10px; 
                margin-bottom: 10px;
            }
            .category-header h2 { font-size: 20px; }
            .product-info h3 { font-size: 12px; line-height: 1.3; }
            .product-info p { font-size: 10px; margin-bottom: 10px; }
            .price { font-size: 14px; }
            .stock-tag { padding: 3px 6px; font-size: 8px; }
            .btn-add { padding: 10px; font-size: 11px; letter-spacing: 0.5px; border-radius: 10px; }
        }

        /* ====== NOTIFICACIÓN TOAST ====== */
        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUpFade 0.4s ease forwards, fadeOut 0.4s ease 2.5s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(5px); }
        .modal-content { background: rgba(255, 255, 255, 0.98); color: #000000; width: 90%; max-width: 480px; padding: 30px; border-radius: 24px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-imagen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 300; }
        .modal-imagen img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .cerrar-zoom { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; font-weight: bold; cursor: pointer; }

        .cart-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            color: #ffffff; padding: 18px; text-align: center; font-weight: 600; cursor: pointer; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-size: 15px; z-index: 100; border-radius: 30px;
            transition: all 0.3s ease; 
        }
        .cart-bar:hover { background: #000000; transform: translateX(-50%) scale(1.02); }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .cart-controls { display: flex; align-items: center; gap: 10px; }
        .btn-qty { background: #f0eae1; color: #000000; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.2s;}
        .btn-qty:hover { background: #e0d6c8;}
        .btn-remove { background: #fde8e8; color: #c53030; border: none; padding: 6px 10px; cursor: pointer; border-radius: 8px; font-size: 11px; font-weight:bold;}
        
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; font-weight: 700; border: none; padding: 15px; width: 100%; border-radius: 14px; cursor: pointer; font-size: 14px; text-align: center; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .btn-instagram:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-close { background: #e8e2dc; color: #000000; border: none; padding: 12px; width: 100%; border-radius: 14px; cursor: pointer; margin-top: 10px; font-weight: 700; text-transform: uppercase;}
        
        .loading { text-align: center; font-size: 16px; color: var(--text-muted); padding: 50px; font-weight: 600; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {opacity: 0.5;} 50% {opacity: 1;} 100% {opacity: 0.5;} }
    </style>
</head>
<body>

    <div class="promo-banner">
        ✨ Entregas personales en Santiago y Monterrey • Pide directo por DM 💖
    </div>

    <header>
        <img src="https://i.postimg.cc/yxGwgwkZ/Disen-o-sin-ti-tulo-(1).png" alt="ANTARA Beauty Co." class="logo-img">

        <div class="filter-container">
            <button class="filter-btn active" onclick="filtrarCategoria('todos', this)">✨ TODO</button>
            <button class="filter-btn" onclick="filtrarCategoria('maquillaje', this)">💄 MAQUILLAJE</button>
            <button class="filter-btn" onclick="filtrarCategoria('skincare', this)">💧 SKINCARE</button>
            <button class="filter-btn" onclick="filtrarCategoria('accesorios', this)">👜 ACCESORIOS</button>
        </div>
    </header>

    <div class="catalog-container" id="catalog">
        <div class="loading">Preparando la experiencia ANTARA... ✨</div>
    </div>

    <!-- Contenedor para Notificaciones Elegantes -->
    <div id="toast-container" class="toast-container"></div>

    <div class="modal-imagen" id="modalZoom" onclick="cerrarZoom()">
        <span class="cerrar-zoom">&times;</span>
        <img id="imgZoom" src="" alt="Vista previa">
    </div>

    <div class="cart-bar" id="barraCarrito" onclick="abrirCarrito()">
        🛍️ Ver Carrito (<span id="contador-items">0</span>) • $<span id="total-bar">0</span> MXN
    </div>

    <div class="modal" id="modalCarrito">
        <div class="modal-content">
            <h2 style="margin-top:0; font-size: 22px; font-family: 'Syne', sans-serif;">Tu Carrito 🛍️</h2>
            <div id="lista-carrito-modal">
                <p style="text-align: center; padding: 20px 0;">Aún no tienes productos.</p>
            </div>
            <h3 style="margin-bottom: 5px; margin-top: 20px; font-size: 18px; display: flex; justify-content: space-between;">
                <span>Total:</span> <span>$<span id="total-modal">0</span> MXN</span>
            </h3>
            
            <button class="btn-instagram" onclick="enviarPedidoInstagram()">Enviar Pedido por DM 📸</button>
            <button class="btn-close" onclick="cerrarCarrito()">Seguir Explorando</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp1DP4PFs8v0H5osvm29B5oJsQDc0rNyf4jFlEbHNbIUDwRHtRluwlFsxywODRGzLe/exec";
        
        let datosOriginales = [];
        let categoriaActiva = 'todos';
        let carrito = [];

        function abrirZoom(urlImagen) {
            document.getElementById('imgZoom').src = urlImagen;
            document.getElementById('modalZoom').style.display = 'flex';
        }

        function cerrarZoom() {
            document.getElementById('modalZoom').style.display = 'none';
        }

        function cargarCatalogo() {
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=procesarDatosCatalogo&t=${new Date().getTime()}`;
            script.onerror = function() {
                document.getElementById('catalog').innerHTML = `<p style="color:#000000; text-align:center;">Error de conexión.</p>`;
            };
            document.body.appendChild(script);
        }

        function procesarDatosCatalogo(datosCrudos) {
            datosOriginales = datosCrudos.map(item => ({
                nombre: item["producto"] || item["nombre"] || "Sin nombre",
                categoria: item["categoría"] || item["categoria"] || "", 
                precio: Number(item["precio"]) || 0,
                desc: item["detalles / tono"] || item["detalles"] || "",
                imagen: item["imagen"] || "",
                existencia: item["existencia"] !== undefined ? Number(item["existencia"]) : 1
            }));
            renderizarCatalogo();
        }

        function filtrarCategoria(cat, boton) {
            categoriaActiva = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById('catalog');
            let html = "";
            let categoriasMap = { "maquillaje": "💄", "skincare": "✨", "accesorios": "👜" };
            let listaCategorias = ["maquillaje", "skincare", "accesorios"];
            let hayProductos = false;

            listaCategorias.forEach(cat => {
                if (categoriaActiva !== 'todos' && categoriaActiva !== cat) return;

                let productosFiltrados = datosOriginales.filter(item => {
                    let c = item.categoria ? item.categoria.trim().toLowerCase() : "";
                    return c.includes(cat) || (cat === "accesorios" && c.includes("accesorio"));
                });

                if (productosFiltrados.length > 0) {
                    hayProductos = true;
                    let tituloCat = cat.charAt(0).toUpperCase() + cat.slice(1);
                    html += `<div class="category-header"><h2>${categoriasMap[cat]} ${tituloCat}</h2></div>`;
                    html += `<div class="products-grid">`;
                    
                    productosFiltrados.forEach((item, index) => {
                        let imagenHtml = item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" class="product-thumb" onclick="abrirZoom('${item.imagen}')">` : '';
                        let enStock = item.existencia > 0;
                        let stockHtml = enStock ? `<span class="stock-tag">Disponible</span>` : `<span class="stock-tag out" style="background:#fde8e8; color:#c53030;">Agotado</span>`;
                        let botonText = window.innerWidth > 600 ? "Agregar al carrito" : "Agregar";
                        let botonHtml = enStock ? `<button class="btn-add" onclick='agregarAlCarrito(${JSON.stringify(item)}, event)'>${botonText}</button>` : `<button class="btn-add" style="background:#ccc; cursor:not-allowed;" disabled>Agotado</button>`;

                        html += `
                            <div class="product-card">
                                <div class="thumb-container">
                                    ${imagenHtml}
                                </div>
                                <div class="product-info">
                                    <h3>${item.nombre}</h3>
                                    <p>${item.desc}</p>
                                    <div class="product-meta">
                                        <span class="price">$${item.precio} MXN</span>
                                        ${stockHtml}
                                    </div>
                                </div>
                                ${botonHtml}
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            });

            if (!hayProductos) {
                html = `<p style="text-align:center; color:var(--text-muted); padding:40px; font-weight:600;">Explorando nuevas colecciones...</p>`;
            }

            contenedor.innerHTML = html;
        }

        function agregarAlCarrito(item, event) {
            let encontrado = carrito.find(i => i.nombre === item.nombre && i.desc === item.desc);
            if (encontrado) {
                encontrado.cantidad += 1;
            } else {
                carrito.push({ nombre: item.nombre, precio: item.precio, desc: item.desc, cantidad: 1 });
            }
            actualizarCarritoUI();
            mostrarToast(item.nombre);
        }

        function mostrarToast(nombreProducto) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>🛍️</span> Se agregó ${nombreProducto} a tu bolsa`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function cambiarCantidad(nombre, desc, cambio) {
            let item = carrito.find(i => i.nombre === nombre && i.desc === desc);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) carrito = carrito.filter(i => !(i.nombre === nombre && i.desc === desc));
            }
            actualizarCarritoUI();
            actualizarModalCarrito();
        }

        function actualizarCarritoUI() {
            let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('contador-items').innerText = totalItems;
            document.getElementById('total-bar').innerText = totalPrice;
            
            document.getElementById('barraCarrito').style.display = totalItems > 0 ? 'block' : 'none';
        }

        function abrirCarrito() {
            actualizarModalCarrito();
            document.getElementById('modalCarrito').style.display = 'flex';
        }

        function cerrarCarrito() {
            document.getElementById('modalCarrito').style.display = 'none';
        }

        function actualizarModalCarrito() {
            const contenedorModal = document.getElementById('lista-carrito-modal');
            let totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('total-modal').innerText = totalPrice;

            if (carrito.length === 0) {
                contenedorModal.innerHTML = "<p style='color: #888; text-align: center; padding:30px 0;'>Tu carrito está vacío. ¡Agrega tus favoritos!</p>";
                return;
            }

            let html = "";
            carrito.forEach(item => {
                let detalleStr = item.desc ? ` <span style="color:#888; font-size:12px; font-weight:normal;">(${item.desc})</span>` : '';
                html += `
                    <div class="cart-item">
                        <div>
                            <strong style="color:#000000; font-size: 14px;">${item.nombre}${detalleStr}</strong><br>
                            <small style="color:#555555; font-weight:600;">$${item.precio} x ${item.cantidad} = $${item.precio * item.cantidad} MXN</small>
                        </div>
                        <div class="cart-controls">
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -1)">-</button>
                            <span style="color:#000000; font-weight:700;">${item.cantidad}</span>
                            <button class="btn-qty" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', 1)">+</button>
                            <button class="btn-remove" onclick="cambiarCantidad('${item.nombre.replace(/'/g, "\\'")}', '${item.desc.replace(/'/g, "\\'")}', -${item.cantidad})">✕</button>
                        </div>
                    </div>
                `;
            });
            contenedorModal.innerHTML = html;
        }

        function enviarPedidoInstagram() {
            if (carrito.length === 0) {
                alert("Primero agrega tus productos favoritos al carrito ✨");
                return;
            }

            let mensaje = "✨ *NUEVO PEDIDO - ANTARA* ✨\n\nHola, me gustaría apartar / comprar los siguientes productos:\n\n";
            let totalGeneral = 0;

            carrito.forEach((item, index) => {
                let subtotal = item.precio * item.cantidad;
                let detalleStr = item.desc ? ` (${item.desc})` : '';
                mensaje += `${index + 1}. ${item.cantidad}x *${item.nombre}${detalleStr}* - $${subtotal} MXN\n`;
                totalGeneral += subtotal;
            });

            mensaje += `\n🛍️ *TOTAL A PAGAR:* *${totalGeneral} MXN*\n\n¿Me confirman disponibilidad y datos por favor? 💖`;

            let url = `https://www.instagram.com/antara_beautyy/`;
            
            navigator.clipboard.writeText(mensaje).then(() => {
                alert("¡Tu pedido se ha copiado! Se abrirá el chat de Instagram para que nos lo pegues y envíes. 💖");
                window.open(url, '_blank');
            }).catch(err => {
                window.open(url, '_blank');
            });
        }

        document.getElementById('barraCarrito').style.display = 'none';
        
        window.addEventListener('resize', renderizarCatalogo);
        
        cargarCatalogo();
    </script>

</body>
</html>
